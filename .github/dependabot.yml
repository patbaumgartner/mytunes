version: 2
updates:
- package-ecosystem: maven
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: org.graalvm.*
- package-ecosystem: github-actions
  groups:
    codeql-action:
      patterns:
      - github/codeql-action*
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
groups:
  multi-step-actions:
    patterns:
    - github/codeql-action/*
