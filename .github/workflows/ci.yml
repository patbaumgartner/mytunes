name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRAALVM_URL: https://download.oracle.com/graalvm/25/archive/graalvm-jdk-25.0.4_linux-x64_bin.tar.gz
  GRAALVM_SHA256: 76007c309f821aaf435bce63162ea0395587fc77350801c81643fe7feea37276

jobs:
  jvm-tests:
    name: Format and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Oracle GraalVM
        id: graalvm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/graalvm
          key: graalvm-jdk-25.0.4-linux-x64

      - name: Install Oracle GraalVM
        if: steps.graalvm-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "$GRAALVM_URL" -o /tmp/graalvm.tar.gz
          echo "$GRAALVM_SHA256  /tmp/graalvm.tar.gz" | sha256sum -c -
          mkdir -p ~/graalvm
          tar -xzf /tmp/graalvm.tar.gz -C ~/graalvm --strip-components=1

      - name: Use Oracle GraalVM
        run: |
          echo "JAVA_HOME=$HOME/graalvm" >> "$GITHUB_ENV"
          echo "$HOME/graalvm/bin" >> "$GITHUB_PATH"

      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      # The browser interop API ships only as a GraalVM JDK module; this repackages it as the
      # Maven artifact the build consumes.
      - name: Install the Web Image interop API
        run: ./tools/install-webimage-api.sh

      - name: Validate formatting and run the JVM suite
        run: ./mvnw -B spring-javaformat:validate test

  container:
    name: Container build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Self-contained: the build stage downloads its own pinned GraalVM and Binaryen.
      - name: Build the image
        run: docker build -t mytunes:ci .

      - name: Start the container
        run: |
          docker run -d --name mytunes -p 8099:8080 mytunes:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8099/healthz && exit 0
            sleep 2
          done
          echo "Container never became healthy" >&2
          docker logs mytunes >&2
          exit 1

      - name: Cache Oracle GraalVM
        id: graalvm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/graalvm
          key: graalvm-jdk-25.0.4-linux-x64

      - name: Install Oracle GraalVM
        if: steps.graalvm-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "$GRAALVM_URL" -o /tmp/graalvm.tar.gz
          echo "$GRAALVM_SHA256  /tmp/graalvm.tar.gz" | sha256sum -c -
          mkdir -p ~/graalvm
          tar -xzf /tmp/graalvm.tar.gz -C ~/graalvm --strip-components=1

      - name: Use Oracle GraalVM
        run: |
          echo "JAVA_HOME=$HOME/graalvm" >> "$GITHUB_ENV"
          echo "$HOME/graalvm/bin" >> "$GITHUB_PATH"

      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      - name: Install the Web Image interop API
        run: ./tools/install-webimage-api.sh

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pom.xml') }}

      - name: Install Playwright Chromium
        run: >
          ./mvnw -B -q org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args='install --with-deps chromium'

      # The tests only launch the Chromium installed above; without the skip flag
      # Playwright.create() downloads and validates every browser, including WebKit
      # dependencies the runner does not have, and the step crawls for many minutes.
      - name: Run browser and container smoke tests against the image
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: >
          ./mvnw -B test -Dsurefire.excludes=
          -Dtest='MyTunesBrowserTests,MiniPlayerBrowserTests,DockerSmokeTests'
          -DfailIfNoTests=false
          -Dmytunes.baseUrl=http://127.0.0.1:8099
          -Dmytunes.dockerImage=mytunes:ci

      - name: Container logs
        if: failure()
        run: docker logs mytunes

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics
          path: target/diagnostics/
          if-no-files-found: ignore

      # Publishes the exact image the suite just verified. Push events on other branches and
      # pull requests never reach Docker Hub, and dependabot pushes carry no secrets anyway.
      - name: Publish the image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker tag mytunes:ci "$DOCKERHUB_USERNAME/mytunes:latest"
          docker tag mytunes:ci "$DOCKERHUB_USERNAME/mytunes:sha-${GITHUB_SHA::12}"
          docker push "$DOCKERHUB_USERNAME/mytunes:latest"
          docker push "$DOCKERHUB_USERNAME/mytunes:sha-${GITHUB_SHA::12}"
          docker logout

      # The Pages site is exactly what nginx serves: extracted from the tested image, so the
      # deployed bytes are the bytes the suite just verified.
      - name: Extract the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker create --name pages-site mytunes:ci
          docker cp pages-site:/usr/share/nginx/html ./_pages-site
          docker rm pages-site

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _pages-site

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
