<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="dark">
	<meta name="description" content="myTunes - a radio player whose entire application is Java compiled to WebAssembly and running in your browser.">
	<title>myTunes</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="icon" href="backgrounds/dawn-lake.svg" type="image/svg+xml">
</head>
<body>
	<!--
		This file is a bootstrap, not part of the application. It carries no behaviour and no
		event handlers: every element inside #mytunes is created and driven by Java compiled to
		WebAssembly. The single script below is generated by GraalVM Web Image and is never
		edited by hand.
	-->
	<div id="mytunes" class="app" data-ready="false">
		<noscript>myTunes needs WebAssembly and JavaScript enabled to run.</noscript>
	</div>
	<script src="mytunes.js"></script>
</body>
</html>
