server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;
	server_tokens off;

	# nginx's stock mime.types already maps application/wasm, which is what lets the browser use
	# streaming compilation. A types block here would replace that whole map rather than add to
	# it, and index.html would be served as a download.

	include /etc/nginx/security-headers.conf;

	gzip on;
	gzip_types application/javascript application/wasm image/svg+xml text/css text/html;
	gzip_min_length 1024;

	location = /healthz {
		include /etc/nginx/security-headers.conf;
		add_header Content-Type text/plain;
		access_log off;
	}

	# The Wasm module and loader are rebuilt on every image build and are addressed by the image
	# tag, so they may be cached hard.
	location ~* \.(wasm|svg|mp3|css)$ {
		include /etc/nginx/security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}

	location = /mytunes.js {
		include /etc/nginx/security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}

	location = /index.html {
		include /etc/nginx/security-headers.conf;
		add_header Cache-Control "no-cache" always;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
