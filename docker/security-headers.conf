# Security headers, kept in one file because nginx does not merge add_header across blocks: a
# location that declares any add_header discards every one inherited from the server block. Each
# location below that sets its own caching header therefore includes this file explicitly.
#
# 'wasm-unsafe-eval' is required rather than optional. Instantiating a WebAssembly module counts as
# eval under CSP, so without it the application does not start at all.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; media-src 'self' https:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
